name: Fonobus Scheduler

on:
  schedule:
    # Argentina UTC-3
    # 6:45 / 07:00 / 07:10 / 07:15 ARG
    - cron: "45 9 * * 2-6"
    - cron: "0 10 * * 2-6"
    - cron: "10 10 * * 2-6"
    - cron: "15 10 * * 2-6"
    # 03:40 Argentina = 06:40 UTC
    # 05:40 Argentina = 08:40 UTC
    # 07:00 Argentina = 10:00 UTC

    # Ejecuta todos los días a las 06:40 UTC (03:40 Argentina)
    - cron: "40 6 * * *"
    # Ejecuta todos los días a las 08:40 UTC (05:40 Argentina)
    - cron: "40 8 * * *"
    # Ejecuta todos los días a las 10:00 UTC (07:00 Argentina)
    - cron: "0 10 * * *"

  workflow_dispatch:

jobs:
  run-fonobus:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run bot
        env:
          # Secrets
          FONOBUS_TOKEN: ${{ secrets.FONOBUS_TOKEN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # Variable de control
          RUN_SCHEDULER: ${{ vars.RUN_SCHEDULER }}
          RUN_DAYS: ${{ vars.RUN_DAYS }}

        run: |
          uv run python main.py
